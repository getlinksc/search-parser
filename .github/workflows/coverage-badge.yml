name: Coverage Badge

on:
  push:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=search_parser --cov-report=term --cov-report=json
          COVERAGE=$(python -c "import json; print(int(float(json.load(open('coverage.json'))['totals']['percent_covered_display'])))")
          echo "COVERAGE=${COVERAGE}%" >> $GITHUB_ENV
          if [ "$COVERAGE" -ge 90 ]; then echo "COVERAGE_COLOR=brightgreen" >> $GITHUB_ENV;
          elif [ "$COVERAGE" -ge 70 ]; then echo "COVERAGE_COLOR=yellow" >> $GITHUB_ENV;
          else echo "COVERAGE_COLOR=red" >> $GITHUB_ENV; fi

      # `secrets` is not available to a step-level `if`, so fold the check into env first.
      - name: Check badge credentials
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          if [ -n "$GIST_SECRET" ] && [ -n "$GIST_ID" ]; then
            echo "BADGE_CREDS=true" >> $GITHUB_ENV
          else
            echo "BADGE_CREDS=false" >> $GITHUB_ENV
            echo "::warning::GIST_SECRET or GIST_ID is unset - skipping the coverage badge update"
          fi

      # The badge is cosmetic - it writes to a gist outside this repo. A missing or
      # expired GIST_SECRET must not take the pipeline red, so the step is skipped
      # when the credentials are absent and tolerated when the gist api rejects them.
      - name: Create coverage badge
        if: ${{ env.BADGE_CREDS == 'true' }}
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: search-parser-coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}
          color: ${{ env.COVERAGE_COLOR }}
          namedLogo: python
